spring:
  application:
    name: document_processing_pipeline
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/suretyseven}
    username: ${DATABASE_USERNAME:suretyseven}
    password: ${DATABASE_PASSWORD:suretyseven}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

document-processing:
  retry-delay-ms: 1200
  max-attempts: 3
  core-pool-size: 2
  max-pool-size: 8
  queue-capacity: 100
