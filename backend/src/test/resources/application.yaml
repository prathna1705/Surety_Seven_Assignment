spring:
  datasource:
    url: jdbc:h2:mem:suretyseven;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

application:
  cors:
    allowed-origins: http://localhost:5173

document-processing:
  retry-delay-ms: 1
  max-attempts: 3
  core-pool-size: 1
  max-pool-size: 1
  queue-capacity: 10
